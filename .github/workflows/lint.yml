name: Lint Rules

on:
  push:
    paths:
      - "Surge/**"
      - "scripts/validate.py"
      - "tests/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "Surge/**"
      - "scripts/validate.py"
      - "tests/**"
      - ".github/workflows/lint.yml"

jobs:
  validate:
    name: Syntax · Duplicates · Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run validation
        run: python scripts/validate.py
